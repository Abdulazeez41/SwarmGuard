services:
  - type: web
    name: swarmguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swarmguard-db
          property: connectionString

databases:
  - name: swarmguard-db
    plan: free
